<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRIKEPOINT Admin</title><style>body{background:#101820;color:#eee;font:16px system-ui;margin:20px}button,input,select{background:#263743;color:white;padding:10px;border:1px solid #536474;border-radius:5px;margin:4px}a{color:#c6df80}article{padding:12px;background:#202c36;margin:8px 0;border-radius:8px}canvas{width:100%;max-width:650px;background:#202c36}pre{white-space:pre-wrap} [hidden]{display:none!important}</style><a href="index.html">← STRIKEPOINT</a><h1>ADMIN CONTROL</h1><p id="status">Проверка доступа…</p><main hidden><button id="users">Игроки</button><button id="rooms">Серверы</button><button id="log">Журнал</button><input id="search" placeholder="Ник игрока"><section id="out"></section><img id="mapReference127" hidden alt="Радар карты" style="width:100%;max-width:420px;display:block;margin:10px 0"><canvas id="map" width="650" height="420" hidden></canvas></main><script>
const $=x=>document.getElementById(x),base='https://strikepoint-server.ilyushenka2379.workers.dev/api/admin/';let watching=null,busy=false;async function api(path,data){const r=await fetch(base+path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+(sessionStorage.getItem('strike.token')||''),'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error);return j}function say(t){$('status').textContent=t}function card(t){const a=document.createElement('article');a.textContent=t;$('out').append(a);return a}function btn(a,t,f){const b=document.createElement('button');b.textContent=t;b.onclick=f;a.append(b)}async function action(p,k){const reason=prompt('Причина');if(!reason)return;const d={uid:p.id,reason};if(k==='coins'){const v=prompt('Количество монет');if(v===null)return;d.amount=Number(v)}if(k==='ban'){const v=prompt('Часы бана (0 = навсегда)','24');if(v===null)return;d.hours=Number(v)}if(!confirm(k+' → '+p.username))return;try{await api(k,d);say('Готово');await users()}catch(e){say(e.message)}}function reset(){watching=null;$('mapReference127').hidden=true;$('map').hidden=true;$('out').replaceChildren()}async function users(){reset();try{for(const p of await api('users?q='+encodeURIComponent($('search').value))){const a=card(p.username+' • '+p.balance+' монет'+(p.until!==null?' • BAN':''));for(const [k,t] of [['coins','Выдать монеты'],['ban','Бан'],['unban','Разбан'],['kick','Кик']])btn(a,t,()=>action(p,k));}}catch(e){say(e.message)}}async function rooms(){reset();try{const list=await api('rooms');for(const r of list){const a=card(r.room+' • '+r.map+' • '+r.mode);btn(a,'Наблюдать',()=>{watching=r.room;const img=$('mapReference127');const file=({mirage:'radar.png',dust2:'dust2-radar.png',inferno:'inferno-radar.png'})[String(r.map).toLowerCase().replace(/^de_/,'')];img.hidden=!file;if(file)img.src='assets/'+file+'?v=127';view()})}if(!list.length)card('Нет зарегистрированных комнат');}catch(e){say(e.message)}}async function view(){if(!watching||busy)return;busy=true;const room=watching;try{const d=await api('view?room='+encodeURIComponent(room));if(watching!==room)return;$('out').replaceChildren();card(room+' • '+d.match.phase+' • '+d.players.length+' игроков');const c=$('map');c.hidden=false;const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);const ps=d.players.filter(p=>p.pos);const scale=Math.min(5,180/Math.max(1,...ps.flatMap(p=>[Math.abs(p.pos[0]),Math.abs(p.pos[2])])));for(const p of d.players){card(p.nick+' • '+p.team+' • HP '+p.hp+' • '+(p.weapon||'—')+' • K/D '+p.kills+'/'+p.deaths);if(!p.pos)continue;const x=325+p.pos[0]*scale,y=210+p.pos[2]*scale;g.fillStyle=p.team==='CT'?'#65baff':'#f1c15c';g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fill();g.fillText(p.nick,x+8,y);g.beginPath();g.moveTo(x,y);g.lineTo(x-Math.sin(p.yaw)*20,y-Math.cos(p.yaw)*20);g.strokeStyle=g.fillStyle;g.stroke();}}catch(e){say(e.message)}finally{busy=false}}$('users').onclick=users;$('rooms').onclick=rooms;$('log').onclick=async()=>{reset();try{for(const x of await api('log'))card(new Date(x.created).toLocaleString()+' • '+x.action+' • '+x.target+' • '+x.amount+' • '+x.reason)}catch(e){say(e.message)}};$('search').onchange=users;api('users').then(()=>{document.querySelector('main').hidden=false;say('Доступ подтверждён');users()}).catch(e=>say(e.message));setInterval(view,1500);
</script></html>
