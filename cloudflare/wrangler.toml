name = "strikepoint-server"
main = "worker.js"
compatibility_date = "2026-11-25"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[d1_databases]]
binding = "DB"
database_name = "strikepoint-db"
database_id = "ВСТАВЬ_DATABASE_ID"
