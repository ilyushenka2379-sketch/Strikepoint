<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRIKEPOINT</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#354653,#10171e 65%);color:#fff;font:16px system-ui;min-height:100vh}header{padding:22px 6vw;border-bottom:1px solid #ffffff24;letter-spacing:3px;font-weight:800}main{max-width:1050px;margin:auto;padding:7vh 6vw;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}h1{font-size:clamp(35px,7vw,76px);margin:0;letter-spacing:-2px}p{color:#b8c6d0;line-height:1.5}a,button{display:inline-block;background:#b7d36c;color:#142016;border:0;padding:14px 24px;font-weight:800;text-decoration:none;cursor:pointer;border-radius:4px}section{background:#202c36;border:1px solid #ffffff25;padding:24px;border-radius:8px}input{width:100%;padding:12px;margin:6px 0 14px;background:#101820;border:1px solid #647481;color:white;font:inherit;border-radius:4px}label{font-size:14px}nav{display:flex;gap:8px;margin-bottom:20px}nav button{background:#344550;color:white;padding:10px;flex:1}nav button[aria-pressed=true]{background:#b7d36c;color:#142016}#status{min-height:45px;font-size:14px} [hidden]{display:none!important}@media(max-width:650px){main{grid-template-columns:1fr;gap:24px;padding-top:5vh}}</style><header>STRIKEPOINT / 1.0.0 beta</header><main><article><p>STRIKEENGINE • BROWSER FPS</p><h1>STRIKEPOINT</h1><p>Тактический шутер. Выбери карту и вступай в матч.</p><a href="game.html">ИГРАТЬ В КС →</a><p id="player">Можно играть гостем.</p></article><section><div id="account" hidden><h2 id="welcome"></h2><button id="logout">Выйти</button></div><div id="auth"><nav><button id="login" aria-pressed="true">Вход</button><button id="register" aria-pressed="false">Регистрация</button></nav><form id="form"><label for="nick">Никнейм</label><input id="nick" required minlength="3" maxlength="24" autocomplete="username"><label for="password">Пароль</label><input id="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password"><p id="status" aria-live="polite"></p><button id="submit">Войти</button></form></div></section></main><script>
const $=id=>document.getElementById(id);let mode='login',timer,seq=0;async function api(path,body){const r=await fetch('https://strikepoint-server.ilyushenka2379.workers.dev/api/'+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(sessionStorage.getItem('strike.token')||'')},...(body?{body:JSON.stringify(body)}:{})});return await r.json()}function status(t){$('status').textContent=t}function setMode(m){mode=m;seq++;clearTimeout(timer);$('login').setAttribute('aria-pressed',m==='login');$('register').setAttribute('aria-pressed',m==='register');$('submit').textContent=m==='login'?'Войти':'Создать аккаунт';$('password').autocomplete=m==='login'?'current-password':'new-password';status('');check()}function check(){clearTimeout(timer);const n=$('nick').value.trim(),id=++seq;if(mode!=='register')return;if(n.length<3){status('Минимум 3 символа');return}status('Проверяем ник…');timer=setTimeout(async()=>{try{const r=await api('check-username?username='+encodeURIComponent(n));if(id===seq)status(r.error|| (r.available?'Ник свободен ✓':'Ник уже занят'));}catch{if(id===seq)status('Сервер аккаунтов недоступен. Можно играть гостем.')}},300)}function show(n){$('auth').hidden=!!n;$('account').hidden=!n;$('welcome').textContent=n?'Привет, '+n:'';$('player').textContent=n?'Игрок: '+n:'Можно играть гостем.';if(n)sessionStorage.setItem('strike.nickname',n);else sessionStorage.removeItem('strike.nickname')}$('login').onclick=()=>setMode('login');$('register').onclick=()=>setMode('register');$('nick').oninput=check;$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;try{const r=await api(mode,{username:$('nick').value.trim(),password:$('password').value});if(r.token){sessionStorage.setItem('strike.token',r.token);$('password').value='';show(r.username)}else status(r.error||'Ошибка')}catch{status('Сервер аккаунтов недоступен. Можно играть гостем.')}finally{$('submit').disabled=false}};$('logout').onclick=async()=>{try{await api('logout',{});sessionStorage.removeItem('strike.token');show(null)}catch{alert('Сервер недоступен')}};api('profile').then(r=>show(r.username)).catch(()=>{show(null);status('Сервер аккаунтов недоступен. Гостевой режим доступен.')});</script></html>
