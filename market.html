<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRIKEPOINT Market</title><style> *{box-sizing:border-box}body{background:#101820;color:#eee;font:16px system-ui;margin:0;padding:20px}header,nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}a{color:#c6df80}button,input,select{font:inherit;padding:10px;border:1px solid #536474;border-radius:5px;background:#263743;color:white}button{cursor:pointer}button:disabled{opacity:.5}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}article{background:#202c36;padding:12px;border-radius:8px;overflow-wrap:anywhere}article img{width:100%;height:90px;object-fit:cover}article button{width:100%;margin-top:8px}#msg{color:#c6df80;min-height:24px}</style><header><a href="index.html">← STRIKEPOINT</a><strong>MARKET</strong><span id="balance"></span></header><nav><button data-tab="list">Рынок</button><button data-tab="mine">Мои предметы</button><button data-tab="shop">Магазин</button><button data-tab="notices" id="bell">🔔 Уведомления</button></nav><input id="search" placeholder="Поиск предмета"><p id="msg" role="status"></p><main id="grid"></main><script src="catalog124.js"></script><script>
const $=id=>document.getElementById(id);let state,tab='list',busy=false;const base='https://strikepoint-server.ilyushenka2379.workers.dev/api/market';async function api(path='',data){const r=await fetch(base+path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+(sessionStorage.getItem('strike.token')||''),'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function refresh(){try{state=await api();render()}catch(e){$('msg').textContent=e.message}}async function act(path,data){if(busy)return;busy=true;try{await api(path,data);$('msg').textContent='Готово';await refresh()}catch(e){$('msg').textContent=e.message}finally{busy=false}}function card(name,desc,skin,action,fn){let a=document.createElement('article');if(skin!=null){let im=document.createElement('img');im.src='assets/skins/'+skin+'.jpg';a.append(im)}let h=document.createElement('strong');h.textContent=name;a.append(h);let p=document.createElement('p');p.textContent=desc;a.append(p);if(action){let b=document.createElement('button');b.textContent=action;b.onclick=fn;a.append(b)}$('grid').append(a)}function render(){if(!state)return;$('balance').textContent=state.balance+' 🪙';$('bell').textContent='🔔 Уведомления ('+state.notices.filter(n=>!n.seen).length+')';$('grid').replaceChildren();const match=i=>catalog[i].toLowerCase().includes($('search').value.toLowerCase());if(tab==='list')for(const x of state.list.filter(x=>match(x.skin)))card(catalog[x.skin],x.seller+' • '+x.price+' 🪙',x.skin,x.seller===state.username?null:'Купить',()=>{if(confirm('Купить за '+x.price+' монет?'))act('/buy',{id:x.id,price:x.price})});if(tab==='mine'){let local=[];try{const e=JSON.parse(localStorage.getItem('strike.economy21')||'{}');local=(e.owned||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<catalog.length&&!(e.marketAdded124||[]).includes(i)&&!state.mine.some(x=>x.skin===i));}catch{}for(const i of local.filter(match))card(catalog[i],'Локальный предмет • продажа недоступна',i,null);if(local.length)$('msg').textContent='Локальные предметы видны, но не подтверждены сервером.';}if(tab==='mine')for(const x of state.mine.filter(x=>match(x.skin)))card(catalog[x.skin],x.price?'На рынке: '+x.price:'В инвентаре',x.skin,x.price?'Снять с продажи':'Продать',()=>{if(x.price)act('/cancel',{id:x.id});else{let p=prompt('Цена в монетах');if(p!==null)act('/list',{id:x.id,price:Number(p)})}});if(tab==='shop')catalog.forEach((n,i)=>{if(!match(i))return;let cost=[150,200,250,300,400,500][Math.min(5,Math.floor(i/6))];card(n,cost+' 🪙',i,state.mine.some(x=>x.skin===i)?null:'Купить',()=>{if(confirm('Купить за '+cost+' монет?'))act('/shop',{skin:i})})});if(tab==='notices')for(const n of state.notices)card('Предмет продан',catalog[n.skin]+' • '+n.buyer+' • +'+n.price+' 🪙 • '+new Date(n.created).toLocaleString(),n.skin);if(!$('grid').children.length)$('grid').textContent='Пока пусто';}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('msg').textContent='';render();if(tab==='notices')act('/read',{})});$('search').oninput=render;refresh();setInterval(()=>{if(!busy)refresh()},15000);
</script></html>
